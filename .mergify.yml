commands_restrictions:
  dequeue:
    conditions:
      - sender-permission >= write
  queue:
    conditions:
      - sender-permission >= write

merge_queue:
  checking_label: mergify-checking
  dequeued_label: mergify-dequeued
  max_parallel_checks: 1
  mode: serial
  queued_label: mergify-queued
  reset_on_external_merge: always
  status_comments: outcomes

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - -draft
      - check-success = ci
    batch_size: 1
    branch_protection_injection_mode: merge
    checks_timeout: auto
    max_checks_retries: 0
    merge_method: squash
    update_method: merge

pull_request_rules:
  - name: queue dependabot Actions updates on green ci
    conditions:
      - base = main
      - -draft
      - author = dependabot[bot]
      - head ~= ^dependabot/github_actions/
      - check-success = ci
    actions:
      queue:
        name: default

  - name: queue dependabot grouped non-breaking npm updates on green ci
    # BIV-478 gave packages/runtime an npm dependabot entry after sharp sat on a
    # high advisory nothing proposed a bump for. Those land as
    # dependabot/npm_and_yarn/ heads, which the Actions-only rule above cannot
    # match, so every one would otherwise be a manual merge.
    #
    # Only the grouped head matches. Dependabot's npm group is named
    # npm-minor-patch and takes minor and patch updates only, so a semver-major
    # arrives ungrouped on its own head, fails this condition, and stays
    # Bradley's merge. A repository adding npm dependabot later must use that
    # same group name to be queued here.
    conditions:
      - base = main
      - -draft
      - author = dependabot[bot]
      - head ~= ^dependabot/npm_and_yarn/.*npm-minor-patch-
      - check-success = ci
    actions:
      queue:
        name: default
