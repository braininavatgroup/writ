"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# BIV-160: local Writ build/test/preview surface. Nonconcurrent mode prevents
# multiple workspaces from competing for the one menu-bar/audio-device runtime.

[git]
archive_on_merge = true
delete_branch_on_archive = true

[scripts]
run_mode = "nonconcurrent"
# Pre-archive cleanup (Conductor's native hook): drop stale worktree refs.
archive = "git worktree prune 2>/dev/null || true"

[scripts.run.preview]
available_in = [ "local" ]
command = "WRIT_UPDATE_FEED= WRIT_SUPPORT_EMAIL= ./build.sh --fast && ./dist/Writ.app/Contents/MacOS/Writ --preview"
default = true
icon = "play"

[scripts.run.test]
available_in = [ "local" ]
command = "swift test --scratch-path .build-test"
icon = "test-tube"

[prompts]
create_pr = "Use .github/pull_request_template.md. Before opening a non-draft PR, add a Linear-recognized relationship to its body (Fixes BIV-n if this PR completes the issue; Refs BIV-n if the issue outlives it). After creation, verify the PR appears as an attachment on that Linear issue. Set it to Agent review only when this Conductor workspace owns the native Review action or a named independent read-only reviewer has been dispatched against the exact head; otherwise keep it Active. Do not request Bradley or move the issue to Review: that happens only after exact-head review is clean, required GitHub checks and threads are clear, and the exact-head handoff succeeds. The no-issue label remains the escape for work that genuinely needed no issue. Code repo: include the CHANGELOG.md entry in the same PR, or add the no-changelog label."
code_review = "Review the exact workspace/PR head against the linked Linear issue and repository contract. Put actionable findings in Conductor Checks. Do not post GitHub review comments, approve, request Bradley, change Linear status, enable auto-merge, or merge. A clean pass is input to the owning agent's exact-head handoff; until that handoff succeeds, the issue remains Agent review."
