"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# BIV-160: local Writ build/test/preview surface. Nonconcurrent mode prevents
# multiple workspaces from competing for the one menu-bar/audio-device runtime.

[git]
archive_on_merge = true
delete_branch_on_archive = true

[scripts]
run_mode = "nonconcurrent"
# Pre-archive cleanup (Conductor's native hook): drop stale worktree refs.
archive = "git worktree prune 2>/dev/null || true"

[scripts.run.layout-preview]
available_in = [ "local" ]
command = "WRIT_UPDATE_FEED= WRIT_SUPPORT_EMAIL= ./build.sh --fast && ./dist/Writ.app/Contents/MacOS/Writ --preview"
icon = "play"

# The site (site/public, writ.braininavat.dance); cloud workspaces have no
# CONDUCTOR_PORT, so it falls back to 8000.
[scripts.run.site]
command = "python3 -m http.server ${CONDUCTOR_PORT:-8000} --bind 127.0.0.1 --directory site/public"
icon = "globe"

# The site, shared to Bradley's phone or iPad (skills: preview).
[scripts.run.site-phone]
command = "~/.agents/skills/preview/preview.sh run ${CONDUCTOR_PORT:-8000} -- python3 -m http.server ${CONDUCTOR_PORT:-8000} --bind 127.0.0.1 --directory site/public"
icon = "smartphone"

[scripts.run.test]
available_in = [ "local" ]
command = "python3 site/test_site_copy.py && python3 site/test_feature_map.py && swift test --scratch-path .build-test"
default = true
icon = "test-tube"

[prompts]
create_pr = "Read AGENTS.md and use the global linear and ship skills to publish the short PR body, verify its Linear attachment, and complete the current review loop. Follow the global policy for handoff and merge eligibility."
code_review = "Review the exact workspace/PR head against the linked issue and AGENTS.md. Report consequential findings in Conductor Checks. Review is read-only: report the verdict to the owning agent, which owns delivery and Linear updates under the global contract."
