name: verify-signing
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_type == 'tag'
    environment: release-signing
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate certificate and read notarization history
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python3 tools/verify_signing.py
