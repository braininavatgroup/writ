name: verify-signing
# A hosted macOS job runs only when Bradley authorizes that run (BIV-1320):
# dispatch from a release tag with hosted_macos set.
on:
  workflow_dispatch:
    inputs:
      hosted_macos:
        description: Run on GitHub-hosted macOS (Bradley authorizes this run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refuse-without-authorization:
    if: ${{ github.ref_type != 'tag' || !inputs.hosted_macos }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Nothing ran: dispatch verify-signing.yml from a v* release tag (--ref v<version>) with hosted_macos set (BIV-1320: a hosted macOS job runs only when Bradley authorizes that run). A skipped job is not a passing check."
          exit 1

  verify:
    if: github.ref_type == 'tag' && inputs.hosted_macos
    environment: release-signing
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate certificate and read notarization history
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python3 tools/verify_signing.py
