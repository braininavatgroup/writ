name: freshness
# Thin caller → B8 update loop in agentic-workflow (BRA-10 Stage 3). Fires after
# each merge (push to main) and on approvals; updates the oldest armed PR.
# The permissions block must cover the reusable job's requests — a nested job
# cannot exceed the caller's grant (GitHub validates at startup).
on:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: freshness
  cancel-in-progress: false
jobs:
  update:
    uses: braininavatgroup/agentic-workflow/.github/workflows/update-armed-prs-reusable.yml@main
