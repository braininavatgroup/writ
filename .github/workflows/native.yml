name: native
# Called only by ci.yml, by local path. writ is public, so its native lane runs
# on GitHub-hosted macOS, never on the Mini's runners, which can reach the login
# Keychain (BIV-1608, Bradley 2026-11-12); standard hosted runners cost nothing
# in a public repository. infra's config/renovate.json hostedMacos.allowed
# names this job, so the org lint accepts it running hosted by default. The
# image matches release.yml, which already runs `swift test` on it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  swift-test:
    # Unchanged by the move to hosted macOS: the lane runs on a main push, a
    # dispatch, or a pull request whose head is in this repository. A fork's
    # pull request still gets no native lane and the caller's aggregate fails
    # closed on the skip; opening it to forks is a separate decision.
    # tools/test_workflows.py pins this gate.
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test with the image's Xcode
        run: |
          set -euo pipefail
          # No `| head`: on the hosted image xcodebuild aborts on the closed pipe
          # (SIGPIPE, exit 134) and pipefail fails the job before swift test.
          xcodebuild -version
          swift test
