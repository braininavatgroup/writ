name: native
# Called only by ci.yml, and called AT MAIN: ci.yml references
# braininavatgroup/writ/.github/workflows/native.yml@main, because the Mini's
# mac-xcode runner group admits a workflow file only at refs/heads/main
# (agent-runtime config/mac-runners.json; the Dubs pattern, DUB-158). The
# checkout below sets no `ref:`, so the called copy still builds the caller's
# commit. The cost: a pull request that edits this file runs main's copy until
# it merges. Routine Xcode work runs on the Mini (BIV-1320, Bradley
# 2026-10-31); the hosted-native-ci label on a same-repository pull request is
# the paid opt-in that routes the same job to GitHub-hosted macos-15.
on:
  workflow_call:
    inputs:
      hosted_native:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  swift-test:
    # This repository is public. The Mini runs only this repository's own
    # commits: a fork's pull request gets no native lane here, and the caller's
    # aggregate fails closed on the skip, so a contributor pushes a branch to
    # this repository instead. The runner group also refuses public
    # repositories until Bradley enables it (BIV-1320).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.hosted_native && '["macos-15"]' || '["self-hosted","macOS","mac-xcode"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test with the installed Xcode
        run: |
          set -euo pipefail
          xcodebuild -version | head -1
          swift test
