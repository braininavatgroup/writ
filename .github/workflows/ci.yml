name: ci
on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so adding hosted-native-ci starts the Swift lane.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Public-tree denylist
        uses: braininavatgroup/agent-operating-policy/.github/actions/public-tree-check@b8c552c8c595504eb3090042422b0e617c4c726b
        with:
          denylist: ${{ vars.PUBLIC_TREE_DENYLIST }}
      - run: python3 site/test_site_copy.py && python3 site/test_feature_map.py && python3 tools/test_verify_signing.py

  # swift test needs Xcode. Routine Xcode work runs on the Mini (BIV-1320): the
  # Mini default arrives when native.yml is registered in the mac-xcode runner
  # group and Bradley has enabled public repositories there; until then a
  # hosted macOS job runs only when Bradley authorizes that run, so this lane
  # runs on macos-15 only behind the hosted-native-ci label, and on main.
  swift-test:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'hosted-native-ci')
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift test

  ci:
    if: always()
    needs: [check, swift-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
          SWIFT: ${{ needs.swift-test.result }}
        run: |
          test "$CHECK" = success || { echo "check: $CHECK"; exit 1; }
          case "$SWIFT" in success|skipped) ;; *) echo "swift-test: $SWIFT"; exit 1 ;; esac
          if [ "$SWIFT" = skipped ]; then echo "::notice::swift test skipped; add the hosted-native-ci label or run swift test locally."; fi

  # Which deployables this push changed. The diff covers the whole pushed
  # range, and an unknown base (new branch, force push) counts as everything.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed"
          else
            git ls-files > "$RUNNER_TEMP/changed"
          fi
          changed() { if grep -Eq "$2" "$RUNNER_TEMP/changed"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          changed site '^(site/|features/|tools/(live|check_feature_map\.py)$|\.github/workflows/deploy-site\.yml$)'

  # Deploys ship only after the checks above pass, from the SHA they tested.
  deploy-site:
    needs: [check, swift-test, changes]
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
