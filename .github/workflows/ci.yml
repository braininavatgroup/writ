name: ci
on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so adding hosted-native-ci starts the Swift lane.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public-tree denylist
        uses: braininavatgroup/agent-operating-policy/.github/actions/public-tree-check@b8c552c8c595504eb3090042422b0e617c4c726b
        with:
          denylist: ${{ vars.PUBLIC_TREE_DENYLIST }}
      - run: python3 site/test_site_copy.py && python3 site/test_feature_map.py && python3 tools/test_verify_signing.py && python3 tools/test_workflows.py

  # Native lane on the Mini's mac-xcode group by default (BIV-1320), hosted
  # macos-15 only behind the hosted-native-ci label Bradley puts on a
  # same-repository pull request. Called at THIS repository's `main`, not by
  # local path, on purpose: the group admits a workflow file only at
  # refs/heads/main (agent-runtime config/mac-runners.json), and a local-path
  # call in a pull request would define the job at the PR's merge ref. The
  # called copy still tests this commit. The cost: a PR that edits native.yml
  # runs main's version until it merges.
  swift-test:
    uses: braininavatgroup/writ/.github/workflows/native.yml@main
    with:
      hosted_native: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'hosted-native-ci') }}

  ci:
    if: always()
    needs: [check, swift-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
          SWIFT: ${{ needs.swift-test.result }}
        run: |
          test "$CHECK" = success || { echo "check: $CHECK"; exit 1; }
          # The lane is owed on every same-repository PR and on main; a fork PR
          # gets none (native.yml skips it) and fails here on purpose.
          test "$SWIFT" = success || { echo "swift-test: $SWIFT (a fork pull request gets no native lane; push the branch to this repository)"; exit 1; }

  # Which deployables this push changed. The diff covers the whole pushed
  # range, and an unknown base (new branch, force push) counts as everything.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed"
          else
            git ls-files > "$RUNNER_TEMP/changed"
          fi
          changed() { if grep -Eq "$2" "$RUNNER_TEMP/changed"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          changed site '^(site/|features/|tools/(live|check_feature_map\.py)$|\.github/workflows/deploy-site\.yml$)'

  # Deploys ship only after the checks above pass, from the SHA they tested.
  deploy-site:
    needs: [ci, changes]
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
