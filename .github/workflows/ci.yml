name: ci
# Minimal deterministic gate so the org ruleset's required `ci` context exists
# here (BRA-10 Stage 3). Product-code tests remain local for now; this job runs
# the dependency-free checks that can execute on Ubuntu.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/test_site_copy.py
