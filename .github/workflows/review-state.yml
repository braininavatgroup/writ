name: review-state

on:
  pull_request:
    types: [synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-state-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  invalidate:
    if: >-
      github.event_name == 'pull_request'
      || github.event.action == 'dismissed'
      || github.event.review.state == 'changes_requested'
    uses: braininavatgroup/brain-in-a-vat-group/.github/workflows/review-state-reusable.yml@main
