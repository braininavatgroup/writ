name: red-main
# Thin caller → red-main filer in brain-in-a-vat-group (BRA-10 Stage 3). Dormant until
# the org secret LINEAR_API_KEY exists.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
jobs:
  file:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    uses: braininavatgroup/brain-in-a-vat-group/.github/workflows/red-main-reusable.yml@main
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
