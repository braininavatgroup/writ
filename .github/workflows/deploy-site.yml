name: deploy-site
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch: {}

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Same check ci.yml runs for site/, kept here too since this workflow's
      # own push trigger (path-filtered to site/**) fires independently of ci's.
      # workflow_dispatch skips the path filter by design, so this still runs
      # then, same as it does on push.
      - run: python3 site/test_site_copy.py

      - name: Deploy site/public to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 pages deploy public --project-name biv-writ --branch main
