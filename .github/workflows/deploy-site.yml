name: deploy-site

# site/public to the biv-writ Cloudflare Pages project (writ.braininavat.dance).
# ci calls this after its check passes on a push to main that changed site/, so
# the SHA that deploys is the SHA ci tested; ci is the only gate, so there is
# no test step here. A dispatch re-deploys main by hand.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ci's check job runs this same install on every PR, so a runner or
      # Playwright change fails there before it can fail after a deploy.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install the locked browser runtime
        run: npm ci
      - name: Install Chromium for the deployed walk
        run: npx playwright install --with-deps chromium

      - name: Deploy site/public to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 pages deploy public --project-name biv-writ --branch main

      # Production must serve the checked-in pages and appcast redirect, plus
      # every link and asset those pages load.
      - name: Live check
        env:
          LIVE_SETTLE_SECONDS: "50"
        run: tools/live site

      # The pages as a person sees them: headless, signed out, read-only.
      - name: Browser walk of the deployed site
        run: tools/live browser

      - name: Retain deployed browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-site-${{ github.sha }}
          path: .context/verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
